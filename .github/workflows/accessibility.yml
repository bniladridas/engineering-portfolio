name: Accessibility

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/articles/
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/articles/building-software-that-lasts/
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/architecture/
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/search/
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/featured/
          configPath: ./lighthouserc.json
          temporaryPublicStorage: false
