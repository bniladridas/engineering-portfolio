<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter, IBM Plex Sans, sans-serif">
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="80" y="60" font-size="28" font-weight="600" fill="#0d0d0d">Reading code from behavior inward</text>
  <text x="80" y="96" font-size="20" fill="#4b4b4b">Start at the behavior, follow the call graph, deep-read only the load-bearing parts.</text>

  <rect x="80" y="160" width="200" height="70" rx="10" fill="#1f883d"/>
  <text x="180" y="204" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">entry point</text>

  <line x1="280" y1="195" x2="360" y2="195" stroke="#0d0d0d" stroke-width="3"/>
  <text x="320" y="175" font-size="16" fill="#4b4b4b">calls</text>

  <rect x="380" y="160" width="200" height="70" rx="10" fill="#ffffff" stroke="#0d0d0b" stroke-width="3"/>
  <text x="480" y="204" font-size="18" font-weight="600" fill="#0d0d0d" text-anchor="middle">service</text>

  <line x1="580" y1="195" x2="660" y2="195" stroke="#0d0d0d" stroke-width="3"/>
  <text x="620" y="175" font-size="16" fill="#4b4b4b">reads</text>

  <rect x="680" y="160" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="3"/>
  <text x="780" y="204" font-size="18" font-weight="600" fill="#0d0d0d" text-anchor="middle">the load-bearing</text>
  <text x="780" y="226" font-size="16" fill="#1f883d" text-anchor="middle">deep-read this</text>

  <line x1="580" y1="235" x2="660" y2="320" stroke="#0d0d0d" stroke-width="3" stroke-dasharray="6 6"/>
  <rect x="680" y="300" width="200" height="70" rx="10" fill="#ffffff" stroke="#e3e3e0" stroke-width="3"/>
  <text x="780" y="340" font-size="18" font-weight="600" fill="#4b4b4b" text-anchor="middle">supporting code</text>
  <text x="780" y="362" font-size="15" fill="#4b4b4b" text-anchor="middle">defer — skim later</text>

  <text x="80" y="440" font-size="18" fill="#4b4b4b">The call graph is the skeleton; deep reading is only for the bones that carry weight.</text>
</svg>
