<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter, IBM Plex Sans, sans-serif">
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="80" y="60" font-size="28" font-weight="600" fill="#0d0d0d">The error message is the interface</text>
  <text x="80" y="96" font-size="20" fill="#4b4b4b">When the tool works you ignore it; when it fails you read every word.</text>

  <rect x="80" y="150" width="500" height="130" rx="12" fill="#f6f6f4" stroke="#e3e3e0" stroke-width="2"/>
  <text x="112" y="192" font-size="18" font-weight="600" fill="#82071e">Error: unable to connect</text>
  <text x="112" y="244" font-size="15" fill="#4b4b4b">a vague failure. four words,</text>
  <text x="112" y="266" font-size="15" fill="#4b4b4b">zero information. the developer</text>
  <text x="112" y="288" font-size="15" fill="#4b4b4b">has no next action.</text>

  <line x1="640" y1="215" x2="700" y2="215" stroke="#1f883d" stroke-width="5"/>
  <text x="670" y="185" font-size="16" font-weight="600" fill="#1f883d" text-anchor="middle">instead</text>

  <rect x="720" y="150" width="400" height="180" rx="12" fill="#ffffff" stroke="#1f883d" stroke-width="3"/>
  <text x="752" y="192" font-size="17" font-weight="600" fill="#0d0d0d">Could not reach api.example.com</text>
  <text x="752" y="218" font-size="17" font-weight="600" fill="#0d0d0d">on port 443.</text>
  <text x="752" y="254" font-size="15" fill="#4b4b4b">1. Check the token is set.</text>
  <text x="752" y="276" font-size="15" fill="#4b4b4b">2. Confirm outbound connections</text>
  <text x="752" y="296" font-size="15" fill="#4b4b4b">   are allowed.</text>
  <text x="752" y="318" font-size="14" fill="#1f883d">what · where · what to do</text>

  <text x="80" y="440" font-size="18" fill="#4b4b4b">A ten-second fix beats a frustrating afternoon — and it is the difference between tools that endure and tools that get replaced.</text>
</svg>
