<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter, IBM Plex Sans, sans-serif">
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="80" y="60" font-size="28" font-weight="600" fill="#0d0d0d">Split the change, keep every step green</text>
  <text x="80" y="96" font-size="20" fill="#4b4b4b">Structure first, behavior second — two small reviews instead of one scary diff.</text>

  <rect x="80" y="160" width="260" height="80" rx="10" fill="#1f883d"/>
  <text x="210" y="196" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">rename &amp; extract</text>
  <text x="210" y="220" font-size="14" fill="#e6f2ea" text-anchor="middle">no behavior change</text>

  <rect x="80" y="280" width="260" height="80" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/>
  <text x="210" y="316" font-size="17" font-weight="600" fill="#0d0d0d" text-anchor="middle">tests still pass</text>
  <text x="210" y="340" font-size="14" fill="#4b4b4b" text-anchor="middle">green at every step</text>

  <line x1="340" y1="200" x2="400" y2="200" stroke="#0d0d0d" stroke-width="3"/>
  <rect x="420" y="160" width="260" height="80" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/>
  <text x="550" y="196" font-size="17" font-weight="600" fill="#0d0d0d" text-anchor="middle">behavior change</text>
  <text x="550" y="220" font-size="14" fill="#4b4b4b" text-anchor="middle">the feature, on clean seams</text>

  <rect x="420" y="280" width="260" height="80" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/>
  <text x="550" y="316" font-size="17" font-weight="600" fill="#0d0d0d" text-anchor="middle">tests updated</text>
  <text x="550" y="340" font-size="14" fill="#4b4b4b" text-anchor="middle">reviewable diff</text>

  <line x1="680" y1="200" x2="740" y2="200" stroke="#0d0d0d" stroke-width="3"/>
  <rect x="760" y="160" width="360" height="200" rx="10" fill="#e6f2ea" stroke="#1f883d" stroke-width="3"/>
  <text x="940" y="230" font-size="17" font-weight="600" fill="#0d0d0d" text-anchor="middle">landed: small commits,</text>
  <text x="940" y="258" font-size="17" font-weight="600" fill="#0d0d0d" text-anchor="middle">each safe to revert,</text>
  <text x="940" y="286" font-size="17" font-weight="600" fill="#0d0d0d" text-anchor="middle">each honest to review</text>
  <text x="940" y="330" font-size="15" fill="#4b4b4b" text-anchor="middle">the repo stays green the whole time</text>

  <text x="80" y="440" font-size="18" fill="#4b4b4b">Diff size is a design decision. Find the seam, and the change reviews itself.</text>
</svg>
