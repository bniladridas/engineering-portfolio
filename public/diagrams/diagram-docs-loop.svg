<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter, IBM Plex Sans, sans-serif">
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="80" y="60" font-size="28" font-weight="600" fill="#0d0d0d">The docs loop</text>
  <text x="80" y="96" font-size="20" fill="#4b4b4b">One commit, two deliverables: the code changes and the doc that explains it.</text>

  <rect x="80" y="160" width="220" height="80" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/>
  <text x="190" y="200" font-size="18" font-weight="600" fill="#0d0d0d" text-anchor="middle">behavior changes</text>
  <text x="190" y="222" font-size="15" fill="#4b4b4b" text-anchor="middle">same commit</text>

  <rect x="380" y="160" width="220" height="80" rx="10" fill="#1f883d"/>
  <text x="490" y="200" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">doc updates</text>
  <text x="490" y="222" font-size="15" fill="#e6f2ea" text-anchor="middle">decisions + edges</text>

  <rect x="680" y="160" width="220" height="80" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/>
  <text x="790" y="200" font-size="18" font-weight="600" fill="#0d0d0d" text-anchor="middle">reviewed together</text>
  <text x="790" y="222" font-size="15" fill="#4b4b4b" text-anchor="middle">same reviewer</text>

  <rect x="900" y="160" width="220" height="80" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="3"/>
  <text x="1010" y="200" font-size="18" font-weight="600" fill="#0d0d0d" text-anchor="middle">docs stay honest</text>
  <text x="1010" y="222" font-size="15" fill="#4b4b4b" text-anchor="middle">no drift</text>

  <line x1="300" y1="200" x2="380" y2="200" stroke="#1f883d" stroke-width="3"/>
  <line x1="600" y1="200" x2="680" y2="200" stroke="#0d0d0d" stroke-width="3"/>
  <line x1="900" y1="200" x2="900" y2="280" stroke="#0d0d0d" stroke-width="3"/>
  <line x1="790" y1="280" x2="790" y2="200" stroke="#0d0d0d" stroke-width="3"/>
  <line x1="790" y1="280" x2="1010" y2="280" stroke="#0d0d0d" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="900" y="300" font-size="15" fill="#4b4b4b" text-anchor="middle">next change lands on top</text>

  <text x="80" y="440" font-size="18" fill="#4b4b4b">Untrustworthy docs are worse than none: they mislead with confidence. Keep them in the commit.</text>
</svg>
