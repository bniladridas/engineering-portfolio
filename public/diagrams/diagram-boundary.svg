<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter, IBM Plex Sans, sans-serif">
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="80" y="60" font-size="28" font-weight="600" fill="#0d0d0d">The boundary absorbs change</text>
  <text x="80" y="96" font-size="20" fill="#4b4b4b">Volatile implementation behind a stable interface — change the middle freely, keep the edge.</text>

  <rect x="80" y="160" width="480" height="220" rx="12" fill="#f6f6f4" stroke="#e3e3e0" stroke-width="2"/>
  <text x="112" y="200" font-size="18" font-weight="600" fill="#0d0d0d">callers</text>
  <text x="112" y="232" font-size="16" fill="#4b4b4b">depend on the contract</text>
  <text x="112" y="332" font-size="16" fill="#4b4b4b">never on internals</text>

  <line x1="600" y1="180" x2="676" y2="180" stroke="#1f883d" stroke-width="6"/>
  <text x="560" y="140" font-size="18" font-weight="600" fill="#1f883d">interface</text>
  <text x="548" y="196" font-size="16" fill="#1f883d">stable</text>

  <rect x="716" y="160" width="404" height="220" rx="12" fill="#ffffff" stroke="#e3e3e0" stroke-width="2"/>
  <text x="748" y="200" font-size="18" font-weight="600" fill="#0d0d0d">implementation</text>
  <text x="748" y="232" font-size="16" fill="#4b4b4b">free to change</text>
  <text x="748" y="332" font-size="16" fill="#4b4b4b">library, cache, storage — swap freely</text>

  <text x="80" y="440" font-size="18" fill="#4b4b4b">The boundary is the design. Everything behind it is the internals.</text>
</svg>
