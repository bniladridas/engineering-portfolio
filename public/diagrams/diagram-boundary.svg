<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" font-family="Inter, IBM Plex Sans, sans-serif">
  <rect x="23" y="32" width="213" height="140" rx="12" fill="#f6f6f4" stroke="#e3e3e0" stroke-width="1"/>
  <text x="46" y="64" font-size="16" font-weight="600" fill="#0d0d0d">callers</text>
  <text x="46" y="92" font-size="15" fill="#4b4b4b">depend on the contract</text>
  <text x="46" y="116" font-size="15" fill="#4b4b4b">never on internals</text>

  <rect x="250" y="32" width="15" height="140" rx="6" fill="#1f883d"/>
  <text x="257" y="26" font-size="15" font-weight="600" fill="#1f883d" text-anchor="middle">interface</text>
  <text x="257" y="184" font-size="15" font-weight="600" fill="#1f883d" text-anchor="middle">stable</text>

  <rect x="279" y="32" width="298" height="140" rx="12" fill="#ffffff" stroke="#e3e3e0" stroke-width="1"/>
  <text x="302" y="64" font-size="16" font-weight="600" fill="#0d0d0d">implementation</text>
  <text x="302" y="92" font-size="15" fill="#4b4b4b">free to change</text>
  <text x="302" y="116" font-size="15" fill="#4b4b4b">library, cache, storage</text>
  <text x="302" y="140" font-size="15" fill="#4b4b4b">swap freely</text>
</svg>
