<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" font-family="Inter, IBM Plex Sans, sans-serif">
  <rect x="23" y="24" width="484" height="48" rx="10" fill="#1f883d"/>
  <text x="46" y="46" font-size="16" font-weight="600" fill="#ffffff">flags</text>
  <text x="46" y="64" font-size="15" fill="#e6f2ea">one run only</text>
  <text x="484" y="54" font-size="15" font-weight="600" fill="#e6f2ea" text-anchor="end">highest precedence</text>

  <rect x="23" y="86" width="484" height="48" rx="10" fill="#ffffff" stroke="#e3e3e0" stroke-width="1"/>
  <text x="46" y="108" font-size="16" font-weight="600" fill="#0d0d0d">environment</text>
  <text x="46" y="126" font-size="15" fill="#4b4b4b">per-machine, carries secrets</text>
  <text x="484" y="116" font-size="15" fill="#4b4b4b" text-anchor="end">overrides the file</text>

  <rect x="23" y="148" width="484" height="48" rx="10" fill="#ffffff" stroke="#e3e3e0" stroke-width="1"/>
  <text x="46" y="170" font-size="16" font-weight="600" fill="#0d0d0d">config file</text>
  <text x="46" y="188" font-size="15" fill="#4b4b4b">checked in, reviewed, shared</text>
  <text x="484" y="178" font-size="15" fill="#4b4b4b" text-anchor="end">overrides defaults</text>

  <rect x="23" y="210" width="484" height="48" rx="10" fill="#f6f6f4" stroke="#e3e3e0" stroke-width="1"/>
  <text x="46" y="232" font-size="16" font-weight="600" fill="#0d0d0d">defaults</text>
  <text x="46" y="250" font-size="15" fill="#4b4b4b">every layer above is optional</text>
  <text x="484" y="240" font-size="15" fill="#4b4b4b" text-anchor="end">lowest precedence</text>

  <line x1="554" y1="258" x2="554" y2="54" stroke="#1f883d" stroke-width="2"/>
  <path d="M548 64 L554 44 L560 64" fill="none" stroke="#1f883d" stroke-width="2"/>
  <text x="560" y="163" font-size="15" font-weight="600" fill="#1f883d">wins</text>
</svg>
